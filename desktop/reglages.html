<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>ARCHIPILOT — Réglages</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 0; padding: 22px; color: #111; background: #fafafa; }
    h1 { font-size: 18px; margin: 0 0 16px; }
    label { display: block; font-size: 13px; margin: 14px 0 4px; color: #444; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px; border: 1px solid #bbb; border-radius: 6px; }
    input.raccourci { cursor: pointer; background: #fff; }
    input.raccourci:focus { outline: 2px solid #111; }
    .aide { font-size: 12px; color: #777; margin-top: 4px; }
    .case { display: flex; gap: 8px; align-items: center; margin-top: 18px; font-size: 13px; }
    button { margin-top: 20px; padding: 9px 18px; font-size: 14px; border: 0; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
    #retour { margin-top: 14px; font-size: 13px; white-space: pre-line; }
    #retour.erreur { color: #b00020; }
    #retour.ok { color: #1b7a3a; }
  </style>
</head>
<body>
  <h1>Réglages d'ARCHIPILOT</h1>

  <label for="afficher">Raccourci : afficher ARCHIPILOT</label>
  <input id="afficher" class="raccourci" type="text" readonly />
  <div class="aide">Cliquez dans le champ puis tapez la combinaison voulue (au moins une touche Ctrl, Alt ou Maj). Retour arrière : désactiver.</div>

  <label for="saisie">Raccourci : saisie rapide d'une tâche</label>
  <input id="saisie" class="raccourci" type="text" readonly />

  <label for="url">Adresse de l'appli en ligne</label>
  <input id="url" type="text" />

  <label class="case"><input id="demarrage" type="checkbox" /> Lancer ARCHIPILOT au démarrage de Windows</label>

  <button id="enregistrer" type="button">Enregistrer</button>
  <div id="retour"></div>
  <script src="reglages.js"></script>
</body>
</html>
